[project]
name = "home-credit-observability"
version = "0.4.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RafaExMachina", email = "fael1928@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "evidently>=0.7,<0.8",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pandera[pandas]>=0.33.1",
    "plotly>=5.24.1",
    "prometheus-client>=0.26.0",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[project.scripts]
home-credit-observability = "home_credit_observability:main"
home-credit = "home_credit_observability.cli:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Novos warnings falham o teste. Exceções abaixo são de dependências
    # fixadas no uv.lock e devem ser revistas quando forem atualizadas.
    "error",
    'ignore:^numpy\.core is deprecated and has been renamed to numpy\._core\.:DeprecationWarning:evidently\.legacy\.tests\.utils$',
    'ignore:^Call to deprecated function \x27Dependency\x27\.:DeprecationWarning:litestar\.utils\.deprecation$',
    'ignore:^Use of deprecated class \x27DependencyKwarg\x27\.:DeprecationWarning:litestar\.params$',
    # Evidently 0.7.23: escape inválido na docstring ao compilar sem cache.
    'ignore:^invalid escape sequence \x27\\d\x27$:SyntaxWarning:.*[/\\]evidently[/\\]descriptors[/\\]text_match(\.py)?$',
]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.12"
packages = ["home_credit_observability"]
ignore_missing_imports = true
